name: ores RPC client fluent proof

on:
  push:
    branches:
      - 'proof/ores-rpc-client-fluent-do-stream'
  pull_request:
    paths:
      - 'proof/ores-rpc-client-fluent/**'
      - '.github/workflows/ores-rpc-client-fluent-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared contract and terminal spelling
        run: bash proof/ores-rpc-client-fluent/check-terminals.sh

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proof/ores-rpc-client-fluent/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: proof/ores-rpc-client-fluent/ts/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proof/ores-rpc-client-fluent/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proof/ores-rpc-client-fluent/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  gleam:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proof/ores-rpc-client-fluent/gleam
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.12.0'
      - run: gleam deps download
      - run: gleam check
