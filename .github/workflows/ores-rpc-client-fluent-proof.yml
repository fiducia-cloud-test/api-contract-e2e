name: ores RPC client fluent proof

on:
  push:
    branches:
      - 'proof/ores-rpc-client-fluent-do-stream'
  pull_request:
    paths:
      - 'proof/ores-rpc-client-fluent/**'
      - '.github/workflows/ores-rpc-client-fluent-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORES_HTTP_CLIENTS_SHA: fe4b3332daee21f1bb7c75a434d7a12a5eb2f258
  ORES_INTERFACES_SHA: a071dbd727418b0483c3d514c862c0bb4f8633c0

jobs:
  terminal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact source heads
        run: |
          git init source
          git -C source fetch --depth=1 https://github.com/ORESoftware/ores-http-clients.git "$ORES_HTTP_CLIENTS_SHA"
          git -C source checkout --detach FETCH_HEAD
          git init interfaces
          git -C interfaces fetch --depth=1 https://github.com/ORESoftware/ores-interfaces.git "$ORES_INTERFACES_SHA"
          git -C interfaces checkout --detach FETCH_HEAD
      - name: Verify exact source and shared terminal contract
        run: |
          test "$(git -C source rev-parse HEAD)" = "$ORES_HTTP_CLIENTS_SHA"
          test "$(git -C interfaces rev-parse HEAD)" = "$ORES_INTERFACES_SHA"
          grep -q 'make_call: "make_call"' interfaces/contracts/rpc-client-call/v1/main.tsp
          grep -q 'do_stream: "do_stream"' interfaces/contracts/rpc-client-call/v1/main.tsp
          grep -q '"enum": \["make_call", "do_stream"\]' interfaces/contracts/rpc-client-call/v1/authored.schema.json
          grep -q '"unary_terminal": "make_call"' source/.contracts/rpc-client-call-binding.json
          grep -q '"stream_terminal": "do_stream"' source/.contracts/rpc-client-call-binding.json
          grep -q 'doStream()' source/src/ts/src/fluent.ts
          ! grep -Eq '^[[:space:]]*stream\(\):' source/src/ts/src/fluent.ts
          grep -q 'doStream()' source/src/dart/lib/src/fluent.dart
          ! grep -Eq '^[[:space:]]*Future<RpcStreamHandle<TOutput>> stream\(' source/src/dart/lib/src/fluent.dart
          grep -q 'pub fn do_stream(self)' source/src/rust/src/fluent.rs
          ! grep -Eq '^[[:space:]]*pub fn stream\(self\)' source/src/rust/src/fluent.rs
          grep -q '^pub fn do_stream(' source/src/gleam/src/ores_http_clients/fluent.gleam
          ! grep -Eq '^pub fn stream\(' source/src/gleam/src/ores_http_clients/fluent.gleam

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact ores-http-clients head
        run: |
          git init source
          git -C source fetch --depth=1 https://github.com/ORESoftware/ores-http-clients.git "$ORES_HTTP_CLIENTS_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$ORES_HTTP_CLIENTS_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test TypeScript package
        working-directory: source/src/ts
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact ores-http-clients head
        run: |
          git init source
          git -C source fetch --depth=1 https://github.com/ORESoftware/ores-http-clients.git "$ORES_HTTP_CLIENTS_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$ORES_HTTP_CLIENTS_SHA"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Test Dart package
        working-directory: source/src/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact ores-http-clients head
        run: |
          git init source
          git -C source fetch --depth=1 https://github.com/ORESoftware/ores-http-clients.git "$ORES_HTTP_CLIENTS_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$ORES_HTTP_CLIENTS_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test Rust package
        working-directory: source/src/rust
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

  gleam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact ores-http-clients head
        run: |
          git init source
          git -C source fetch --depth=1 https://github.com/ORESoftware/ores-http-clients.git "$ORES_HTTP_CLIENTS_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$ORES_HTTP_CLIENTS_SHA"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.14.0'
      - name: Check Gleam package
        working-directory: source/src/gleam
        run: |
          gleam deps download
          gleam check
