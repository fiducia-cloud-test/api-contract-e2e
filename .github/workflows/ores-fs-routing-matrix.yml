name: ores filesystem routing matrix certification

on:
  push:
    branches:
      - test/ores-fs-routing-matrix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiducia-test-ores-fs-routing-matrix
  cancel-in-progress: true

jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out test consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Certify filesystem route grammar and precedence
        run: cargo run --manifest-path certification/ores-fs-routing-matrix/Cargo.toml
