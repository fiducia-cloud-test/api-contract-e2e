name: oreslang embedding temp ci

on:
  push:
    branches:
      - tmp/oreslang-embedding-ci-20261005

permissions:
  contents: read

concurrency:
  group: oreslang-embedding-temp-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oreslang-ci
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build native carrier and run embedding intrinsic tests
        run: |
          chmod +x scripts/build-native-thread.sh
          mvn -B -ntp -Dores.runtime.carriers=native -Dtest=EmbeddingIntrinsicRuntimeTest test
