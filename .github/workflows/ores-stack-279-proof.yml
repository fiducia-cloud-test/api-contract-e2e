name: ores-stack 279 exact-head proof

on:
  pull_request:
    paths:
      - '.github/workflows/ores-stack-279-proof.yml'

permissions:
  contents: read

concurrency:
  group: ores-stack-279-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Mint least-privilege ORESoftware source token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PORTFOLIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_GITHUB_APP_PRIVATE_KEY }}
          owner: ORESoftware
          repositories: ores-stack
          permission-contents: read

      - name: Check out immutable ores-stack PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: ORESoftware/ores-stack
          ref: 64b9ee3c5be16c55f67fec896df0990ccdf752a0
          token: ${{ steps.source-token.outputs.token }}
          path: ores-stack
          persist-credentials: false
          show-progress: false

      - name: Assert immutable source identity
        working-directory: ores-stack
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "64b9ee3c5be16c55f67fec896df0990ccdf752a0"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Rustfmt workspace
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Check workspace with locked dependency graph
        working-directory: ores-stack
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo check --workspace --all-targets --locked

      - name: Test workspace with locked dependency graph
        working-directory: ores-stack
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo test --workspace --locked

      - name: Check AWS and GCP runtime package
        working-directory: ores-stack
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/ores-lambda-runtime/Cargo.toml -- --check
          cargo check --manifest-path crates/ores-lambda-runtime/Cargo.toml --all-features
          cargo test --manifest-path crates/ores-lambda-runtime/Cargo.toml --all-features
