name: TJSV peer-authority canary

on:
  pull_request:
    paths:
      - 'contracts/tjsv-canary/**'
      - 'tests/tjsv_peer_authority.test.mjs'
      - '.github/workflows/tjsv-peer-authority.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/tjsv-canary/**'
      - 'tests/tjsv_peer_authority.test.mjs'
      - '.github/workflows/tjsv-peer-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tjsv-peer-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  TJSV_SHA: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405

jobs:
  peer-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
          show-progress: false
      - name: Verify test-org and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY_OWNER" in *-test) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Check out immutable TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_SHA }}
          path: tmp/tjsv
          persist-credentials: false
          show-progress: false
          fetch-depth: 1
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Install locked compiler and emitter closure
        run: npm ci --prefix tmp/tjsv --ignore-scripts --no-audit --no-fund
      - name: Compile TypeSpec, compare generated Schema B with authored Schema A, and test drift
        run: node --test tests/tjsv_peer_authority.test.mjs
      - name: Reject committed generated witness and prove source immutability
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find contracts -name 'typespec.generated.schema.json' -print -quit)"
          git diff --exit-code -- contracts/tjsv-canary tests/tjsv_peer_authority.test.mjs .github/workflows/tjsv-peer-authority.yml
          git -C tmp/tjsv diff --exit-code
